name: Browser smoke renders

on:
  push:
    branches:
      - 'phase-1/**'
      - 'phase-2/**'
      - 'phase-3/**'
      - 'phase-4/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce non-persistent onboarding controller
        if: ${{ hashFiles('onboarding.js') != '' }}
        run: |
          set -euo pipefail
          if grep -En 'localStorage|sessionStorage|document\.cookie|indexedDB|fetch\s*\(|XMLHttpRequest|sendBeacon|WebSocket' onboarding.js; then
            echo 'The onboarding controller must remain non-persistent and network-free.'
            exit 1
          fi

      - name: Enforce disabled account preview
        if: ${{ hashFiles('account.js', 'auth-adapter.js') != '' }}
        run: |
          set -euo pipefail
          if grep -En 'localStorage|sessionStorage|document\.cookie|indexedDB|fetch\s*\(|XMLHttpRequest|sendBeacon|WebSocket|EventSource|navigator\.credentials|service[_-]?role|supabase[_-]?(url|key)|anon[_-]?key' account.js auth-adapter.js; then
            echo 'The Phase 4 account preview must remain provider-free, non-persistent, and network-disabled.'
            exit 1
          fi

      - name: Start local site and render key pages
        run: |
          set -euo pipefail
          python -m http.server 8080 > /tmp/deaddict-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/index.html > /dev/null; then
              break
            fi
            sleep 1
          done

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No supported Chrome/Chromium executable found on the runner."
            exit 1
          fi

          mkdir -p browser-smoke
          common_flags=(--headless=new --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage)

          "$browser" "${common_flags[@]}" --window-size=1440,1200 --screenshot=browser-smoke/index-desktop.png http://127.0.0.1:8080/index.html
          "$browser" "${common_flags[@]}" --window-size=390,844 --screenshot=browser-smoke/index-mobile.png http://127.0.0.1:8080/index.html
          "$browser" "${common_flags[@]}" --window-size=390,844 --screenshot=browser-smoke/onboarding-mobile.png http://127.0.0.1:8080/onboarding.html
          "$browser" "${common_flags[@]}" --window-size=390,844 --screenshot=browser-smoke/onboarding-review-mobile.png 'http://127.0.0.1:8080/onboarding.html?ci-smoke=alcohol'
          "$browser" "${common_flags[@]}" --window-size=390,1000 --screenshot=browser-smoke/account-mobile.png http://127.0.0.1:8080/account.html
          "$browser" "${common_flags[@]}" --window-size=390,1000 --screenshot=browser-smoke/account-settings-mobile.png 'http://127.0.0.1:8080/account.html?ci-smoke=account'
          "$browser" "${common_flags[@]}" --window-size=390,844 --screenshot=browser-smoke/dashboard-mobile.png http://127.0.0.1:8080/dashboard.html
          "$browser" "${common_flags[@]}" --window-size=390,844 --screenshot=browser-smoke/checkin-mobile.png http://127.0.0.1:8080/checkin.html
          "$browser" "${common_flags[@]}" --window-size=1440,1200 --screenshot=browser-smoke/alcohol-desktop.png http://127.0.0.1:8080/support-alcohol.html
          "$browser" "${common_flags[@]}" --window-size=1440,1200 --screenshot=browser-smoke/plans-desktop.png http://127.0.0.1:8080/pricing.html
          "$browser" "${common_flags[@]}" --window-size=1440,1200 --screenshot=browser-smoke/privacy-desktop.png http://127.0.0.1:8080/privacy.html

          "$browser" "${common_flags[@]}" --dump-dom http://127.0.0.1:8080/onboarding.html > browser-smoke/onboarding-dom.html
          "$browser" "${common_flags[@]}" --dump-dom 'http://127.0.0.1:8080/onboarding.html?ci-smoke=alcohol' > browser-smoke/onboarding-review-dom.html
          "$browser" "${common_flags[@]}" --dump-dom http://127.0.0.1:8080/account.html > browser-smoke/account-dom.html
          "$browser" "${common_flags[@]}" --dump-dom 'http://127.0.0.1:8080/account.html?ci-smoke=account' > browser-smoke/account-settings-dom.html

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class OnboardingParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.steps = {}
                  self.selected = []
                  self.summary = {}
                  self.current_summary = None
                  self.safety_hidden = None
                  self.root = {}

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if 'data-onboarding' in values:
                      self.root = values
                  step = values.get('data-onboarding-step')
                  if step:
                      self.steps[step] = 'hidden' in values
                  classes = values.get('class', '').split()
                  if 'onboarding-option' in classes and values.get('aria-pressed') == 'true':
                      self.selected.append(values.get('data-value'))
                  if 'data-summary' in values:
                      self.current_summary = values['data-summary']
                      self.summary[self.current_summary] = ''
                  if 'data-substance-safety' in values:
                      self.safety_hidden = 'hidden' in values

              def handle_data(self, data):
                  if self.current_summary:
                      self.summary[self.current_summary] += data

              def handle_endtag(self, tag):
                  if tag == 'strong' and self.current_summary:
                      self.summary[self.current_summary] = self.summary[self.current_summary].strip()
                      self.current_summary = None

          class AccountParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.root = {}
                  self.panels = {}
                  self.checked = 0
                  self.email_value = ''
                  self.status_hidden = None
                  self.status_text = ''
                  self.in_status = False

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if 'data-account-preview' in values:
                      self.root = values
                  panel = values.get('data-account-panel')
                  if panel:
                      self.panels[panel] = 'hidden' in values
                  if tag == 'input' and values.get('id') == 'accountEmail':
                      self.email_value = values.get('value', '')
                  if tag == 'input' and values.get('type') == 'checkbox' and 'checked' in values:
                      self.checked += 1
                  if 'data-account-status' in values:
                      self.status_hidden = 'hidden' in values
                      self.in_status = True

              def handle_data(self, data):
                  if self.in_status:
                      self.status_text += data

              def handle_endtag(self, tag):
                  if tag == 'p' and self.in_status:
                      self.in_status = False
                      self.status_text = self.status_text.strip()

          def parse(parser_type, path):
              parser = parser_type()
              parser.feed(Path(path).read_text(encoding='utf-8'))
              return parser

          initial = parse(OnboardingParser, 'browser-smoke/onboarding-dom.html')
          if initial.steps != {'category': False, 'approach': True, 'review': True}:
              raise SystemExit(f'Unexpected initial onboarding visibility: {initial.steps}')
          if initial.selected:
              raise SystemExit(f'Onboarding must begin without preselected answers: {initial.selected}')
          if initial.summary != {'category': 'Not selected', 'approach': 'Not selected'}:
              raise SystemExit(f'Unexpected initial summary: {initial.summary}')

          review = parse(OnboardingParser, 'browser-smoke/onboarding-review-dom.html')
          if review.steps != {'category': True, 'approach': True, 'review': False}:
              raise SystemExit(f'CI onboarding did not reach review: {review.steps}')
          if review.selected != ['Alcohol', 'Stop completely']:
              raise SystemExit(f'Unexpected selected onboarding values: {review.selected}')
          if review.summary != {'category': 'Alcohol', 'approach': 'Stop completely'}:
              raise SystemExit(f'Unexpected review summary: {review.summary}')
          if review.safety_hidden is not False:
              raise SystemExit('Alcohol safety notice must be visible at review.')
          if review.root.get('data-ci-smoke-complete') != 'true':
              raise SystemExit('Local CI onboarding flow did not complete.')
          if review.root.get('data-ci-focused') != 'review-title':
              raise SystemExit(f'Review heading did not receive focus: {review.root.get("data-ci-focused")}')

          account_initial = parse(AccountParser, 'browser-smoke/account-dom.html')
          if account_initial.panels != {'signed-out': False, 'link-requested': True, 'signed-in': True}:
              raise SystemExit(f'Unexpected initial account visibility: {account_initial.panels}')
          if account_initial.checked or account_initial.email_value:
              raise SystemExit('Account preview must begin without an email value or preselected consent.')
          if account_initial.root.get('data-auth-adapter') != 'disabled':
              raise SystemExit(f'Auth adapter is not disabled: {account_initial.root}')

          account_settings = parse(AccountParser, 'browser-smoke/account-settings-dom.html')
          if account_settings.panels != {'signed-out': True, 'link-requested': True, 'signed-in': False}:
              raise SystemExit(f'CI account flow did not reach signed-in preview: {account_settings.panels}')
          if account_settings.root.get('data-auth-adapter') != 'disabled':
              raise SystemExit('CI account flow used an unexpected auth adapter state.')
          if account_settings.root.get('data-ci-smoke-complete') != 'true':
              raise SystemExit('Local CI account flow did not complete.')
          if account_settings.root.get('data-ci-state') != 'signed-in':
              raise SystemExit(f'Unexpected CI account state: {account_settings.root.get("data-ci-state")}')
          if account_settings.root.get('data-ci-email-cleared') != 'true' or account_settings.email_value:
              raise SystemExit('Account preview did not clear the entered email address.')
          if account_settings.root.get('data-ci-focused') != 'settings-title':
              raise SystemExit(f'Signed-in heading did not retain focus: {account_settings.root.get("data-ci-focused")}')
          if account_settings.status_hidden is not False or 'no export request was created' not in account_settings.status_text:
              raise SystemExit(f'Export preview status is missing or incorrect: {account_settings.status_text!r}')
          PY

          for image in browser-smoke/*.png; do
            test -s "$image"
          done

      - name: Upload browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deaddict-browser-smoke
          path: browser-smoke/*
          if-no-files-found: error
          retention-days: 14