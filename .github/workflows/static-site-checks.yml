name: Static site checks

on:
  push:
    branches:
      - main
      - phase-1/**
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Validate local pages and assets
        run: python scripts/check_static_site.py
