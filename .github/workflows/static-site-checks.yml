name: Static site checks

on:
  push:
    branches:
      - main
      - 'phase-1/**'
      - 'phase-2/**'
      - 'phase-3/**'
      - 'phase-4/**'
      - 'phase-5/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shared JavaScript syntax
        run: node --check script.js

      - name: Validate onboarding JavaScript syntax
        if: ${{ hashFiles('onboarding.js') != '' }}
        run: node --check onboarding.js

      - name: Validate account preview JavaScript syntax
        if: ${{ hashFiles('account.js', 'auth-adapter.js') != '' }}
        run: |
          node --check account.js
          node --check auth-adapter.js

      - name: Validate disabled server operation syntax
        if: ${{ hashFiles('server/disabled-account-operations.mjs') != '' }}
        run: node --check server/disabled-account-operations.mjs

      - name: Compile Python utilities
        if: ${{ hashFiles('scripts/*.py') != '' }}
        run: python -m py_compile scripts/*.py

      - name: Validate local pages and assets
        if: ${{ hashFiles('scripts/check_static_site.py') != '' }}
        run: python scripts/check_static_site.py

      - name: Validate Phase 3 private-data SQL
        if: ${{ hashFiles('scripts/check_phase3_sql.py') != '' }}
        run: python scripts/check_phase3_sql.py

      - name: Validate Phase 4 account and server contracts
        if: ${{ hashFiles('scripts/check_phase4_contracts.py') != '' }}
        run: python scripts/check_phase4_contracts.py

      - name: Validate Phase 5 deployment guardrails
        if: ${{ hashFiles('scripts/check_phase5_deployment.py') != '' }}
        run: python scripts/check_phase5_deployment.py
